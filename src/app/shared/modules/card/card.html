<div class="flex flex-column background p-4" [style.--my-color-border]="'var(--' + secColor() + ')'">
  <div class="flex flex-column justify-content-center align-items-center">
    <div class="iconBackground" [style.--my-color-background]="'var(--' + secColor() + ')'">
      <mat-icon class="color-icon" [style.--my-color]="'var(--' + color() + ')'">
        {{ nameIcon() }}
      </mat-icon>
    </div>
    <div>
      <h3 class="title" [style.--my-color]="'var(--' + color() + ')'">{{ title() }}</h3>
    </div>
    <div class="text-center">
      {{ subtitle() }}
    </div>
  </div>
  <div class="m-4">
    <ul class="custom-list" [style.--my-color]="'var(--' + color() + ')'">
      @for (item of list(); track item) {
        <div class="flex align-items-center">
          <li>{{ item }}</li>
        </div>
      }
    </ul>

  </div>
  <div class="p-2">
    <button matMiniFab class="w-full gap-2 buttonColor" [style.--my-color]="'var(--' + color() + ')'">
      <span class="font-bold">Gerenciar {{ nameButton() }}</span>
      <mat-icon iconPositionEnd>arrow_forward</mat-icon>
    </button>
  </div>

</div>
